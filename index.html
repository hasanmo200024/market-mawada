<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماركت المودة – إدارة البضائع</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef4e8;--card:#fff;--tx:#12301f;--mut:#5f7566;--pri:#0f6b3a;--yl:#f5b301;--bd:#d3e0ca;--bad:#b3392f;--ok:#0f6b3a;--hd:#0b3d22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#07200f;--card:#0e3320;--tx:#eaf5ec;--mut:#9bb8a4;--pri:#8dc63f;--bd:#1c4a31;--bad:#ff8077;--ok:#8dc63f;--hd:#052914}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#07200f;--card:#0e3320;--tx:#eaf5ec;--mut:#9bb8a4;--pri:#8dc63f;--bd:#1c4a31;--bad:#ff8077;--ok:#8dc63f;--hd:#052914}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5}
.login{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:14px}
.lbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px;width:100%;max-width:400px;text-align:center;box-shadow:0 8px 30px #0003}
.lg{width:150px;height:150px;border-radius:18px;object-fit:cover}
h1{margin:6px 0 0;font-size:22px;color:var(--pri)}.by{color:var(--mut);font-size:13px;margin:2px 0 12px}
input,select,button{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px;text-align:right}
button{background:var(--yl);color:#1b1b00;border:0;cursor:pointer;font-weight:700;margin-top:12px}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--bd);width:auto;margin:0;padding:3px 9px;font-weight:400}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 14px;background:var(--hd);color:#fff}
header img{width:44px;height:44px;border-radius:10px;vertical-align:middle;margin-left:8px}header b{font-size:17px}
header button{width:auto;margin:0;background:#fff2;color:#fff;padding:5px 12px;font-weight:400}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{margin:0;width:auto;white-space:nowrap;background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:400}
nav button.on{background:var(--yl);color:#1b1b00;border-color:var(--yl);font-weight:700}
main{padding:14px;max-width:960px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 6px;color:var(--pri)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0 10px}
.calc{background:var(--bg);border:1px dashed var(--yl);border-radius:10px;padding:10px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px}
.calc b{color:var(--pri)}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:480px}
th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mut);font-weight:600}
.big{font-size:28px;font-weight:700}.in{color:var(--ok)}.out{color:var(--bad)}
#inv{position:fixed;inset:0;background:#000a;overflow:auto;padding:14px;z-index:9}
.paper{background:#fff;color:#111;max-width:720px;margin:auto;padding:20px;border-radius:8px;border-top:8px solid #0f6b3a}
.paper .lg{width:90px;height:90px}.paper th,.paper td{border-bottom:1px solid #ddd;color:#111}.paper th{background:#eef4e8}
.ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #f5b301;padding-bottom:10px;margin-bottom:10px}
.ph h2{margin:0;color:#0f6b3a}.ft{text-align:center;color:#666;font-size:12px;margin-top:14px}
@media print{body>*:not(#inv){display:none!important}#inv{position:static;background:none;padding:0}.noprint{display:none!important}.paper{border-radius:0}}
</style>
</head>

function bal(){return S.tx.reduce(function(s,t){return s+(t.type=='in'?t.amt:-t.amt)},0)}
function item(nm){return S.items.filter(function(i){return i.name==nm})[0]}
function render(){
 var a=$('app');
 if(!auth){
  if(!S.user){a.innerHTML='<div class="login"><div class="lbox"><img class="lg" src="'+LOGO+'"><h1>إنشاء حساب جديد</h1><div class="by">تصميم المودة للبرمجيات</div>'
   +fld('rn','الاسم')+fld('rp','رقم الهاتف','tel')+fld('rc','اسم الشركة / المحل')+fld('ra','العنوان')+fld('rw','كلمة المرور','password')
   +'<button onclick="reg()">إنشاء الحساب</button><div class="err" id="e"></div></div></div>';}
  else{a.innerHTML='<div class="login"><div class="lbox"><img class="lg" src="'+LOGO+'"><h1>'+E(S.user.company)+'</h1><div class="by">تصميم المودة للبرمجيات</div>'
   +fld('lp','رقم الهاتف','tel')+fld('lw','كلمة المرور','password')+'<button onclick="login()">تسجيل الدخول</button><div class="err" id="e"></div></div></div>';}
  return}
 var low=S.items.filter(function(i){return i.min>0&&i.stock<=i.min}).length,T=[['sell','المبيعات'],['buy','المشتريات'],['cust','العملاء'],['supp','الموردين'],['inv','الفواتير'],['stock','المخزن'+(low?' ⚠'+low:'')],['cash','الخزينة'],['rep','التقارير'],['set','نسخ احتياطي وتصدير']];
 a.innerHTML='<header><div><img src="'+LOGO+'"><b>'+E(S.user.company)+'</b></div><button onclick="auth=false;render()">خروج</button></header><nav>'
  +T.map(function(t){return '<button class="'+(tab==t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';sel=null;render()">'+t[1]+'</button>'}).join('')+'</nav><main id="m"></main>';
 if(tab=='sell')sellV();else if(tab=='buy')buyV();else if(tab=='cust')partyV('c');else if(tab=='supp')partyV('s');else if(tab=='stock')stockV();else if(tab=='inv')invV();else if(tab=='rep')repV();else if(tab=='set')setV();else cashV();
}
function reg(){
 var u={name:$('rn').value.trim(),phone:$('rp').value.trim(),company:$('rc').value.trim(),addr:$('ra').value.trim(),pw:$('rw').value};
 if(!u.name||!u.phone||!u.company||!u.pw){$('e').textContent='املأ الاسم والهاتف واسم الشركة وكلمة المرور';return}
 S.user=u;save();auth=true;render()}
function login(){
 if($('lp').value.trim()!==S.user.phone||$('lw').value!==S.user.pw){$('e').textContent='بيانات الدخول غير صحيحة';return}
 auth=true;render()}
/* ---------- المبيعات ---------- */
function sellV(){
 $('m').innerHTML='<div class="card"><h3>فاتورة بيع'+(ed&&ed.k=='s'?' (تعديل رقم '+ed.id+') <button class="sec" onclick="ed=null;cart=[];render()">إلغاء التعديل</button>':'')+'</h3><label>العميل</label><select id="sc"><option value="">عميل نقدي</option>'
 +S.cust.map(function(c){return '<option value="'+c.id+'">'+E(c.name)+'</option>'}).join('')+'</select>'
 +'<div class="g"><div><label>الصنف</label><select id="si" onchange="sp()"><option value="">— اختر —</option>'
 +S.items.map(function(i){return '<option value="'+E(i.name)+'">'+E(i.name)+' (متاح '+f(i.stock)+')</option>'}).join('')+'</select></div>'
 +'<div><label>نوع البيع</label><select id="st" onchange="sp()"><option value="pr">قطاعي</option><option value="pw">جملة</option><option value="ps">جملة الجملة</option></select></div>'
 +'<div><label>الكمية</label><input id="sq" type="number" step="any"></div><div><label>سعر الوحدة</label><input id="sx" type="number" step="any"></div></div>'
 +'<button onclick="addS()">+ إضافة للفاتورة</button><div class="err" id="e"></div><div id="cl"></div></div>';if(pre!==''){$('sc').value=pre;pre=''}rc()}
function sp(){var i=item($('si').value);if(i)$('sx').value=i[$('st').value]||0}
function addS(){
 var i=item($('si').value),q=n('sq'),x=n('sx'),tn={pr:'قطاعي',pw:'جملة',ps:'جملة الجملة'}[$('st').value];
 if(!i||q<=0||x<=0){$('e').textContent='اختر الصنف واكتب الكمية والسعر';return}
 var used=cart.filter(function(l){return l.name==i.name}).reduce(function(s,l){return s+l.q},0);
 if(q+used>i.stock){$('e').textContent='الكمية أكبر من المتاح';return}
 $('e').textContent='';cart.push({name:i.name,type:tn,q:q,x:x,t:q*x,c:i.cost});rc()}
function rc(){
 var t=cart.reduce(function(s,l){return s+l.t},0);
 $('cl').innerHTML=cart.length?'<div class="sc"><table><tr><th>الصنف</th><th>النوع</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr>'
 +cart.map(function(l,k){return '<tr><td>'+E(l.name)+'</td><td>'+l.type+'</td><td>'+f(l.q)+'</td><td>'+f(l.x)+'</td><td>'+f(l.t)+'</td><td><button class="sec" onclick="cart.splice('+k+',1);rc()">✕</button></td></tr>'}).join('')
 +'</table></div><div class="calc"><span>إجمالي الفاتورة: <b>'+f(t)+'</b></span></div><label>المبلغ المدفوع الآن (اتركه فارغاً = مدفوع بالكامل)</label><input id="pd" type="number" step="any"><button onclick="saveS()">حفظ الفاتورة</button>':''}
function saveS(){
 var t=cart.reduce(function(s,l){return s+l.t},0),pv=$('pd').value,paid=pv===''?t:Math.min(parseFloat(pv)||0,t),cid=$('sc').value;
 if(cid===''&&paid<t)paid=t;
 var o=ed&&ed.k=='s'?revert('s',ed.id):null;ed=null;cart.forEach(function(l){item(l.name).stock-=l.q});
 var inv={id:o?o.id:++S.ns,ts:o?o.ts:Date.now(),cid:cid,lines:cart,total:t,paid:paid};S.sales.unshift(inv);
 if(paid>0)addTx('in',paid,'فاتورة بيع #'+inv.id);cart=[];save();showInv('s',inv.id)}
/* ---------- المشتريات ---------- */
function buyV(){
 $('m').innerHTML='<div class="card"><h3>فاتورة شراء'+(ed&&ed.k=='b'?' (تعديل رقم '+ed.id+') <button class="sec" onclick="ed=null;bcart=[];render()">إلغاء التعديل</button>':'')+'</h3><label>المورد</label><select id="bs"><option value="">— اختر المورد —</option>'
 +S.supp.map(function(c){return '<option value="'+c.id+'">'+E(c.name)+'</option>'}).join('')+'</select>'
 +'<label>اسم الصنف</label><input id="nm" list="dl" oninput="fill()"><datalist id="dl">'+S.items.map(function(i){return '<option value="'+E(i.name)+'">'}).join('')+'</datalist>'
 +'<div class="g"><div><label>عدد القطع/الكيلو في الكرتونة</label><input id="up" type="number" step="any" oninput="bcalc()"></div>'
 +'<div><label>عدد الكراتين</label><input id="q" type="number" step="any" oninput="bcalc()"></div>'
 +'<div><label>سعر شراء الكرتونة</label><input id="cp" type="number" step="any" oninput="bcalc()"></div></div>'
 +'<div class="calc"><span>سعر القطعة/الكيلو: <b id="r1">0</b></span><span>إجمالي القطع: <b id="r2">0</b></span><span>إجمالي السطر: <b id="r3">0</b></span></div>'
 +'<div class="g"><div><label>سعر القطاعي</label><input id="pr" type="number" step="any"></div><div><label>سعر الجملة</label><input id="pw" type="number" step="any"></div><div><label>سعر جملة الجملة</label><input id="ps" type="number" step="any"></div></div>'
 +'<button onclick="addB()">+ إضافة للفاتورة</button><div class="err" id="e"></div><div id="cl"></div></div>';if(pre!==''){$('bs').value=pre;pre=''}rb()}
function bcalc(){var u=n('up'),q=n('q'),c=n('cp');$('r1').textContent=u?f(c/u):0;$('r2').textContent=f(u*q);$('r3').textContent=f(q*c)}
function fill(){var i=item($('nm').value);if(i){$('up').value=i.up;$('pr').value=i.pr;$('pw').value=i.pw;$('ps').value=i.ps;bcalc()}}
function addB(){
 var nm=$('nm').value.trim(),u=n('up'),q=n('q'),c=n('cp');
 if(!nm||u<=0||q<=0||c<=0){$('e').textContent='كمّل الاسم وعدد القطع والكمية وسعر الكرتونة';return}
 $('e').textContent='';bcart.push({name:nm,up:u,q:q,cp:c,x:c/u,t:q*c,pr:n('pr'),pw:n('pw'),ps:n('ps')});rb()}
function rb(){
 var t=bcart.reduce(function(s,l){return s+l.t},0);
 $('cl').innerHTML=bcart.length?'<div class="sc"><table><tr><th>الصنف</th><th>الكراتين</th><th>سعر الكرتونة</th><th>سعر القطعة</th><th>الإجمالي</th><th></th></tr>'
 +bcart.map(function(l,k){return '<tr><td>'+E(l.name)+'</td><td>'+f(l.q)+'</td><td>'+f(l.cp)+'</td><td>'+f(l.x)+'</td><td>'+f(l.t)+'</td><td><button class="sec" onclick="bcart.splice('+k+',1);rb()">✕</button></td></tr>'}).join('')
 +'</table></div><div class="calc"><span>إجمالي الفاتورة: <b>'+f(t)+'</b></span></div><label>المبلغ المدفوع للمورد (فارغ = مدفوع بالكامل)</label><input id="pd" type="number" step="any"><button onclick="saveB()">حفظ الفاتورة</button>':''}
function saveB(){
 var sid=$('bs').value;if(!sid){$('e').textContent='اختر المورد (أضفه من قسم الموردين)';return}
 var t=bcart.reduce(function(s,l){return s+l.t},0),pv=$('pd').value,paid=pv===''?t:Math.min(parseFloat(pv)||0,t);
 var o=ed&&ed.k=='b'?revert('b',ed.id):null;ed=null;bcart.forEach(function(l){var i=item(l.name);if(!i){i={name:l.name,stock:0};S.items.push(i)}
  i.up=l.up;i.cost=l.x;i.pr=l.pr;i.pw=l.pw;i.ps=l.ps;i.stock+=l.up*l.q});
 var inv={id:o?o.id:++S.nb,ts:o?o.ts:Date.now(),sid:sid,lines:bcart,total:t,paid:paid};S.buys.unshift(inv);
 if(paid>0)addTx('out',paid,'فاتورة شراء #'+inv.id);bcart=[];save();showInv('b',inv.id)}
/* ---------- العملاء والموردين ---------- */
function pname(k,id){var L=k=='c'?S.cust:S.supp,p=L.filter(function(x){return x.id==id})[0];return p?p.name:(k=='c'?'عميل نقدي':'—')}
function st(k,id){
 var docs=(k=='c'?S.sales.filter(function(s){return s.cid==id}):S.buys.filter(function(b){return b.sid==id})),
 pays=S.pay.filter(function(p){return p.k==k&&p.pid==id}),
 tot=docs.reduce(function(s,x){return s+x.total},0),
 paid=docs.reduce(function(s,x){return s+x.paid},0)+pays.reduce(function(s,x){return s+x.amt},0);
 return {docs:docs,pays:pays,tot:tot,paid:paid,bal:tot-paid}}
function partyV(k){
 var L=k=='c'?S.cust:S.supp,w=k=='c'?'العميل':'المورد';
 if(sel){stV(k);return}
 $('m').innerHTML='<div class="card"><h3>إضافة '+w+'</h3><div class="g"><div>'+fld('pn','الاسم')+'</div><div>'+fld('pp','رقم الهاتف','tel')+'</div></div><button onclick="addP(\''+k+'\')">حفظ</button><div class="err" id="e"></div></div>'
 +'<div class="card"><h3>'+(k=='c'?'العملاء':'الموردين')+'</h3><div class="sc"><table><tr><th>الاسم</th><th>الهاتف</th><th>إجمالي الفواتير</th><th>المسدد</th><th>'+(k=='c'?'المتبقي عليه':'المتبقي له')+'</th><th></th></tr>'
 +L.map(function(p){var s=st(k,p.id);return '<tr><td>'+E(p.name)+'</td><td>'+E(p.phone)+'</td><td>'+f(s.tot)+'</td><td>'+f(s.paid)+'</td><td class="'+(s.bal>0?'out':'in')+'">'+f(s.bal)+'</td><td><button class="sec" onclick="sel='+p.id+';render()">كشف حساب</button></td></tr>'}).join('')+'</table></div></div>'}
function addP(k){var nm=$('pn').value.trim();if(!nm){$('e').textContent='اكتب الاسم';return}
 (k=='c'?S.cust:S.supp).push({id:Date.now(),name:nm,phone:$('pp').value.trim()});save();partyV(k)}
function stV(k){
 var s=st(k,sel),rows=[];
 s.docs.forEach(function(d){rows.push({ts:d.ts,t:'فاتورة '+(k=='c'?'بيع':'شراء')+' #'+d.id,dr:d.total,cr:d.paid,id:d.id})});
 s.pays.forEach(function(p){rows.push({ts:p.ts,t:'سداد'+(p.note?' – '+E(p.note):''),dr:0,cr:p.amt})});
 rows.sort(function(a,b){return b.ts-a.ts});
 $('m').innerHTML='<div class="card"><button class="sec" onclick="sel=null;render()">← رجوع</button><h3>'+E(pname(k,sel))+'</h3>'+'<div class="g"><div><label>الاسم</label><input id="en" value="'+E(pname(k,sel))+'"></div><div><label>الهاتف</label><input id="ep" value="'+E(P(k,sel).phone)+'"></div></div><button class="sec" onclick="editP(\''+k+'\')">حفظ التعديل</button> '+(s.docs.length||s.pays.length?'':'<button class="sec" onclick="delP(\''+k+'\')">حذف</button>')
 +'<div class="calc"><span>إجمالي الفواتير: <b>'+f(s.tot)+'</b></span><span>المسدد: <b>'+f(s.paid)+'</b></span><span>الرصيد المتبقي: <b class="'+(s.bal>0?'out':'in')+'">'+f(s.bal)+'</b></span></div>'
 +'<div class="g"><div>'+fld('pa','مبلغ السداد','number')+'</div><div>'+fld('pt','ملاحظة')+'</div></div><button onclick="payP(\''+k+'\')">تسجيل سداد</button></div>'
 +'<div class="card"><h3>كشف الحساب</h3><div class="sc"><table><tr><th>التاريخ والوقت</th><th>البيان</th><th>قيمة الفاتورة</th><th>مسدد</th><th></th></tr>'
 +rows.map(function(r){return '<tr><td>'+dt(r.ts)+'</td><td>'+r.t+'</td><td>'+(r.dr?f(r.dr):'')+'</td><td>'+f(r.cr)+'</td><td>'+(r.id?'<button class="sec" onclick="showInv(\''+(k=='c'?'s':'b')+'\','+r.id+')">عرض</button>':'')+'</td></tr>'}).join('')+'</table></div></div>'}
function payP(k){var a=n('pa');if(a<=0)return;
 S.pay.unshift({ts:Date.now(),k:k,pid:sel,amt:a,note:$('pt').value});
 addTx(k=='c'?'in':'out',a,'سداد '+(k=='c'?'من ':'إلى ')+pname(k,sel));save();stV(k)}
/* ---------- الفاتورة ---------- */
function showInv(k,id){
 var d=(k=='s'?S.sales:S.buys).filter(function(x){return x.id==id})[0],u=S.user,sale=k=='s',
 pn=sale?pname('c',d.cid):pname('s',d.sid),rem=d.total-d.paid;
 $('inv').style.display='block';
 $('inv').innerHTML='<div class="paper"><div class="ph"><img class="lg" src="'+LOGO+'"><div><h2>'+E(u.company)+'</h2><div>'+E(u.addr)+'</div><div>هاتف: '+E(u.phone)+'</div></div></div>'
 +'<h3 style="margin:4px 0">فاتورة '+(sale?'بيع':'شراء')+' رقم '+d.id+'</h3><div>التاريخ والوقت: '+dt(d.ts)+'</div><div>'+(sale?'العميل: ':'المورد: ')+E(pn)+'</div>'
 +'<div class="sc"><table><tr><th>الصنف</th><th>الكمية</th><th>'+(sale?'السعر':'سعر الكرتونة')+'</th><th>الإجمالي</th></tr>'
 +d.lines.map(function(l){return '<tr><td>'+E(l.name)+(sale?' ('+l.type+')':'')+'</td><td>'+f(l.q)+(sale?'':' كرتونة')+'</td><td>'+f(sale?l.x:l.cp)+'</td><td>'+f(l.t)+'</td></tr>'}).join('')+'</table></div>'
 +'<h3>الإجمالي: '+f(d.total)+' ج.م</h3><div>المدفوع: '+f(d.paid)+' ج.م</div><div>المتبقي: <b>'+f(rem)+' ج.م</b></div>'
 +'<div class="ft">شكراً لتعاملكم معنا – تصميم المودة للبرمجيات</div>'
 +'<div class="noprint"><button onclick="window.print()">🖨 طباعة / حفظ PDF</button><button style="background:#cfe8c0" onclick="editInv(\''+k+'\','+id+')">✏️ تعديل</button><button style="background:#f4c7c3" onclick="delInv(\''+k+'\','+id+')">🗑 حذف</button><button style="background:#ddd" onclick="closeInv()">إغلاق</button><div class="by">لحفظ PDF اختر «حفظ كـ PDF» من نافذة الطباعة</div></div></div>'}
function closeInv(){$('inv').style.display='none';render()}
function revert(k,id){var A=k=='s'?S.sales:S.buys,d=A.filter(function(x){return x.id==id})[0];
 d.lines.forEach(function(l){var i=item(l.name);if(i){i.stock+=k=='s'?l.q:-l.up*l.q;if(i.stock<0)i.stock=0}});
 S.tx=S.tx.filter(function(t){return t.note!=(k=='s'?'فاتورة بيع #':'فاتورة شراء #')+id});A.splice(A.indexOf(d),1);return d}
function delInv(k,id){if(!confirm('حذف الفاتورة وإرجاع المخزون والخزينة؟'))return;revert(k,id);save();closeInv()}
function editInv(k,id){var d=(k=='s'?S.sales:S.buys).filter(function(x){return x.id==id})[0],c=JSON.parse(JSON.stringify(d.lines));
 ed={k:k,id:id};if(k=='s'){cart=c;pre=d.cid;tab='sell'}else{bcart=c;pre=d.sid;tab='buy'}sel=null;closeInv()}
function P(k,id){return (k=='c'?S.cust:S.supp).filter(function(x){return x.id==id})[0]||{}}
function editP(k){var p=P(k,sel);p.name=$('en').value.trim()||p.name;p.phone=$('ep').value.trim();save();stV(k)}
function delP(k){if(!confirm('حذف؟'))return;var L=k=='c'?S.cust:S.supp;L.splice(L.indexOf(P(k,sel)),1);sel=null;save();render()}
function stockV(){
 var v=S.items.reduce(function(s,i){return s+i.stock*i.cost},0),lw=S.items.filter(function(i){return i.min>0&&i.stock<=i.min});
 $('m').innerHTML=(lw.length?'<div class="card out"><b>⚠ تنبيه نقص مخزون:</b> '+lw.map(function(i){return E(i.name)+' ('+f(i.stock)+')'}).join('، ')+'</div>':'')
 +'<div class="card"><h3>المخزن</h3><div>قيمة المخزون بسعر الشراء: <b>'+f(v)+'</b></div><div class="sc"><table><tr><th>الصنف</th><th>المتاح</th><th>سعر الشراء</th><th>قطاعي</th><th>جملة</th><th>جملة الجملة</th><th>حد التنبيه</th><th></th></tr>'
 +S.items.map(function(i,k){return '<tr><td>'+E(i.name)+'</td><td class="'+(i.min>0&&i.stock<=i.min?'out':'')+'">'+f(i.stock)+'</td><td>'+f(i.cost)+'</td>'+['pr','pw','ps','min'].map(function(p){return '<td><input type="number" step="any" style="width:80px;padding:4px" value="'+(i[p]||0)+'" onchange="S.items['+k+'].'+p+'=parseFloat(this.value)||0;save()"></td>'}).join('')+'<td><button class="sec" onclick="delIt('+k+')">حذف</button></td></tr>'}).join('')+'</table></div></div>'}
function delIt(k){if(confirm('حذف الصنف؟')){S.items.splice(k,1);save();stockV()}}
function invV(){
 var all=S.sales.map(function(d){return {k:'s',d:d,p:pname('c',d.cid)}}).concat(S.buys.map(function(d){return {k:'b',d:d,p:pname('s',d.sid)}})).sort(function(a,b){return b.d.ts-a.d.ts});
 $('m').innerHTML='<div class="card"><h3>سجل الفواتير</h3><div class="sc"><table><tr><th>التاريخ والوقت</th><th>النوع</th><th>رقم</th><th>الطرف</th><th>الإجمالي</th><th>المتبقي</th><th></th></tr>'
 +all.map(function(r){var d=r.d;return '<tr><td>'+dt(d.ts)+'</td><td>'+(r.k=='s'?'بيع':'شراء')+'</td><td>'+d.id+'</td><td>'+E(r.p)+'</td><td>'+f(d.total)+'</td><td>'+f(d.total-d.paid)+'</td><td><button class="sec" onclick="showInv(\''+r.k+'\','+d.id+')">عرض</button></td></tr>'}).join('')+'</table></div></div>'}
function repV(){
 var a=rf?new Date(rf).getTime():0,b=rt?new Date(rt).getTime()+864e5:Infinity,sales=0,cost=0,per={};
 function inr(x){return x.ts>=a&&x.ts<b}
 var ss=S.sales.filter(inr),bb=S.buys.filter(inr),tx=S.tx.filter(inr);
 ss.forEach(function(s){sales+=s.total;s.lines.forEach(function(l){var c=l.c!=null?l.c:(item(l.name)||{cost:0}).cost;cost+=l.q*c;per[l.name]=per[l.name]||{q:0,p:0};per[l.name].q+=l.q;per[l.name].p+=l.q*(l.x-c)})});
 var buys=bb.reduce(function(s,x){return s+x.total},0),exp=tx.filter(function(t){return t.type=='out'&&t.note.indexOf('فاتورة شراء')!==0&&t.note.indexOf('سداد')!==0}).reduce(function(s,t){return s+t.amt},0),
 rec=S.cust.reduce(function(s,p){return s+st('c',p.id).bal},0),pay=S.supp.reduce(function(s,p){return s+st('s',p.id).bal},0),pf=sales-cost-exp;
 $('m').innerHTML='<div class="card"><h3>التقارير</h3><div class="g"><div><label>من تاريخ</label><input type="date" value="'+rf+'" onchange="rf=this.value;repV()"></div><div><label>إلى تاريخ</label><input type="date" value="'+rt+'" onchange="rt=this.value;repV()"></div></div>'
 +'<div class="calc"><span>المبيعات: <b>'+f(sales)+'</b></span><span>تكلفة البضاعة المباعة: <b>'+f(cost)+'</b></span><span>مصروفات: <b>'+f(exp)+'</b></span><span>المشتريات: <b>'+f(buys)+'</b></span></div>'
 +'<div class="calc"><span>صافي الربح: <b class="'+(pf>=0?'in':'out')+'">'+f(pf)+'</b></span><span>مستحق لدى العملاء: <b>'+f(rec)+'</b></span><span>مستحق للموردين: <b>'+f(pay)+'</b></span><span>رصيد الخزينة: <b>'+f(bal())+'</b></span></div></div>'
 +'<div class="card"><h3>الأصناف الأعلى ربحاً</h3><div class="sc"><table><tr><th>الصنف</th><th>الكمية المباعة</th><th>الربح</th></tr>'
 +Object.keys(per).sort(function(x,y){return per[y].p-per[x].p}).map(function(k){return '<tr><td>'+E(k)+'</td><td>'+f(per[k].q)+'</td><td>'+f(per[k].p)+'</td></tr>'}).join('')+'</table></div></div>'}
function dl(name,data){var fb=function(){var b=new Blob([data],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()};if(!window.claude){fb();return}claude.use('downloads').then(function(d){if(!d){fb();return}d.save({filename:name,data:data}).catch(function(){})})}
function csv(R){return '\ufeff'+R.map(function(r){return r.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"'}).join(',')}).join('\n')}
function ex(w){var R;
 if(w=='items')R=[['الصنف','المتاح','سعر الشراء','قطاعي','جملة','جملة الجملة']].concat(S.items.map(function(i){return [i.name,i.stock,i.cost,i.pr,i.pw,i.ps]}));
 else if(w=='sales'){R=[['التاريخ','رقم','العميل','الصنف','النوع','الكمية','السعر','الإجمالي']];S.sales.forEach(function(d){d.lines.forEach(function(l){R.push([dt(d.ts),d.id,pname('c',d.cid),l.name,l.type,l.q,l.x,l.t])})})}
 else if(w=='buys'){R=[['التاريخ','رقم','المورد','الصنف','الكراتين','سعر الكرتونة','الإجمالي']];S.buys.forEach(function(d){d.lines.forEach(function(l){R.push([dt(d.ts),d.id,pname('s',d.sid),l.name,l.q,l.cp,l.t])})})}
 else if(w=='cust'||w=='supp'){var k=w=='cust'?'c':'s';R=[['الاسم','الهاتف','إجمالي الفواتير','المسدد','المتبقي']].concat((k=='c'?S.cust:S.supp).map(function(p){var s=st(k,p.id);return [p.name,p.phone,s.tot,s.paid,s.bal]}))}
 else R=[['التاريخ','البيان','وارد','صادر']].concat(S.tx.map(function(t){return [dt(t.ts),t.note,t.type=='in'?t.amt:'',t.type=='out'?t.amt:'']}));
 dl(w+'.csv',csv(R))}
function setV(){
 var B=[['items','المخزن'],['sales','المبيعات'],['buys','المشتريات'],['cust','العملاء'],['supp','الموردين'],['cash','الخزينة']];
 $('m').innerHTML='<div class="card"><h3>تصدير إلى Excel (CSV)</h3><div class="g">'+B.map(function(b){return '<button onclick="ex(\''+b[0]+'\')">'+b[1]+'</button>'}).join('')+'</div></div>'
 +'<div class="card"><h3>نسخة احتياطية</h3><div>احفظ نسخة من كل بياناتك، أو انقلها لجهاز آخر.</div><button onclick="dl(\'mawadda-backup.json\',JSON.stringify(S))">حفظ نسخة احتياطية</button>'
 +'<label>استرجاع نسخة (ملف .json)</label><input type="file" accept=".json" onchange="restore(this)"><div class="err" id="e"></div></div>'}
function restore(el){var fl=el.files[0];if(!fl)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.user||!o.items)throw 0;if(!confirm('سيتم استبدال البيانات الحالية. متابعة؟'))return;S=Object.assign(S,o);save();alert('تم الاسترجاع');render()}catch(e){$('e').textContent='الملف غير صالح'}};r.readAsText(fl)}
/* ---------- المخزن والخزينة ---------- */
function stockOld(){
 var v=S.items.reduce(function(s,i){return s+i.stock*i.cost},0);
 $('m').innerHTML='<div class="card"><h3>المخزن</h3><div>قيمة المخزون بسعر الشراء: <b>'+f(v)+'</b></div><div class="sc"><table><tr><th>الصنف</th><th>المتاح</th><th>سعر الشراء</th><th>قطاعي</th><th>جملة</th><th>جملة الجملة</th></tr>'
 +S.items.map(function(i){return '<tr><td>'+E(i.name)+'</td><td>'+f(i.stock)+'</td><td>'+f(i.cost)+'</td><td>'+f(i.pr)+'</td><td>'+f(i.pw)+'</td><td>'+f(i.ps)+'</td></tr>'}).join('')+'</table></div></div>'}
function cashV(){
 var b=bal();
 $('m').innerHTML='<div class="card"><h3>رصيد الخزينة</h3><div class="big '+(b>=0?'in':'out')+'">'+f(b)+' ج.م</div></div>'
 +'<div class="card"><h3>حركة يدوية</h3><div class="g"><div><label>النوع</label><select id="ct"><option value="in">إيداع</option><option value="out">سحب / مصروف</option></select></div><div>'+fld('ca','المبلغ','number')+'</div><div>'+fld('cn','البيان')+'</div></div><button onclick="manual()">حفظ</button></div>'
 +'<div class="card"><h3>سجل الحركات</h3><div class="sc"><table><tr><th>التاريخ والوقت</th><th>البيان</th><th>وارد</th><th>صادر</th></tr>'
 +S.tx.slice(0,80).map(function(t){return '<tr><td>'+dt(t.ts)+'</td><td>'+E(t.note)+'</td><td class="in">'+(t.type=='in'?f(t.amt):'')+'</td><td class="out">'+(t.type=='out'?f(t.amt):'')+'</td></tr>'}).join('')+'</table></div></div>'}
function manual(){var a=n('ca');if(a<=0)return;addTx($('ct').value,a,$('cn').value||'حركة يدوية');save();cashV()}
render();
</script>
